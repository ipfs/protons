syntax = "proto3";

message SpecPacked {
  string str = 4;
  repeated int32 packed = 5;
}

message DefaultPackedTypes {
  repeated double doubles = 1;
  repeated float floats = 2;
  repeated int32 int32s = 3;
  repeated int64 int64s = 4;
  repeated uint32 uint32s = 5;
  repeated uint64 uint64s = 6;
  repeated sint32 sint32s = 7;
  repeated sint64 sint64s = 8;
  repeated fixed32 fixed32s = 9;
  repeated fixed64 fixed64s = 10;
  repeated sfixed32 sfixed32s = 11;
  repeated sfixed64 sfixed64s = 12;
  repeated bool bools = 13;
}

message OptionPackedTypes {
  repeated double doubles = 1 [features.repeated_field_encoding=PACKED];
  repeated float floats = 2 [features.repeated_field_encoding=PACKED];
  repeated int32 int32s = 3 [features.repeated_field_encoding=PACKED];
  repeated int64 int64s = 4 [features.repeated_field_encoding=PACKED];
  repeated uint32 uint32s = 5 [features.repeated_field_encoding=PACKED];
  repeated uint64 uint64s = 6 [features.repeated_field_encoding=PACKED];
  repeated sint32 sint32s = 7 [features.repeated_field_encoding=PACKED];
  repeated sint64 sint64s = 8 [features.repeated_field_encoding=PACKED];
  repeated fixed32 fixed32s = 9 [features.repeated_field_encoding=PACKED];
  repeated fixed64 fixed64s = 10 [features.repeated_field_encoding=PACKED];
  repeated sfixed32 sfixed32s = 11 [features.repeated_field_encoding=PACKED];
  repeated sfixed64 sfixed64s = 12 [features.repeated_field_encoding=PACKED];
  repeated bool bools = 13 [features.repeated_field_encoding=PACKED];
}

message OptionExpandedTypes {
  repeated double doubles = 1 [features.repeated_field_encoding=EXPANDED];
  repeated float floats = 2 [features.repeated_field_encoding=EXPANDED];
  repeated int32 int32s = 3 [features.repeated_field_encoding=EXPANDED];
  repeated int64 int64s = 4 [features.repeated_field_encoding=EXPANDED];
  repeated uint32 uint32s = 5 [features.repeated_field_encoding=EXPANDED];
  repeated uint64 uint64s = 6 [features.repeated_field_encoding=EXPANDED];
  repeated sint32 sint32s = 7 [features.repeated_field_encoding=EXPANDED];
  repeated sint64 sint64s = 8 [features.repeated_field_encoding=EXPANDED];
  repeated fixed32 fixed32s = 9 [features.repeated_field_encoding=EXPANDED];
  repeated fixed64 fixed64s = 10 [features.repeated_field_encoding=EXPANDED];
  repeated sfixed32 sfixed32s = 11 [features.repeated_field_encoding=EXPANDED];
  repeated sfixed64 sfixed64s = 12 [features.repeated_field_encoding=EXPANDED];
  repeated bool bools = 13 [features.repeated_field_encoding=EXPANDED];
}
