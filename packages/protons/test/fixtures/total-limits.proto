syntax = "proto3";

message LimitedBatch {
  repeated LimitedEntry entries = 1;
  LimitedEntry single = 2;
  map<string, LimitedEntry> byKey = 3;
  repeated LimitedEntry others = 4;
}

message LimitedEntry {
  repeated bytes ids = 1;
  repeated uint32 numbers = 2;
  map<string, bytes> values = 3;
  repeated uint32 expanded = 4 [packed = false];
}
